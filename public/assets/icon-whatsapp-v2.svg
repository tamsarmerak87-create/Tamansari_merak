<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes bounce {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes float {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(2deg); }
      }
      .wa-char { animation: bounce 1.8s ease-in-out infinite; }
      .wa-float { animation: float 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background glow -->
  <circle cx="100" cy="100" r="100" fill="#25d366" opacity="0.08"/>
  
  <!-- Character body (rounded) -->
  <g class="wa-char">
    <!-- Head -->
    <circle cx="100" cy="70" r="35" fill="#25d366"/>
    
    <!-- Body -->
    <rect x="75" y="100" width="50" height="45" rx="15" fill="#25d366"/>
    
    <!-- Left arm -->
    <g class="wa-float" style="transform-origin: 75px 110px">
      <rect x="40" y="105" width="35" height="18" rx="9" fill="#25d366"/>
      <!-- Hand -->
      <circle cx="35" cy="114" r="12" fill="#25d366"/>
    </g>
    
    <!-- Right arm waving -->
    <g style="animation: wave 1.5s ease-in-out infinite">
      <rect x="125" y="95" width="35" height="18" rx="9" fill="#25d366"/>
      <!-- Hand -->
      <circle cx="165" cy="104" r="12" fill="#25d366"/>
    </g>
    
    <!-- Legs -->
    <g>
      <rect x="80" y="145" width="12" height="30" rx="6" fill="#25d366"/>
      <rect x="108" y="145" width="12" height="30" rx="6" fill="#25d366"/>
      <!-- Shoes -->
      <ellipse cx="86" cy="178" rx="8" ry="6" fill="#1a9e4a"/>
      <ellipse cx="114" cy="178" rx="8" ry="6" fill="#1a9e4a"/>
    </g>
  </g>

  <!-- Eyes happy -->
  <g>
    <!-- Left eye -->
    <circle cx="85" cy="60" r="7" fill="white"/>
    <circle cx="85" cy="60" r="4" fill="#333"/>
    <circle cx="87" cy="58" r="1.5" fill="white"/>
    
    <!-- Right eye -->
    <circle cx="115" cy="60" r="7" fill="white"/>
    <circle cx="115" cy="60" r="4" fill="#333"/>
    <circle cx="117" cy="58" r="1.5" fill="white"/>
  </g>

  <!-- Happy mouth -->
  <path d="M 90 75 Q 100 85 110 75" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Rosy cheeks -->
  <ellipse cx="60" cy="70" rx="10" ry="8" fill="#ffb3ba" opacity="0.5"/>
  <ellipse cx="140" cy="70" rx="10" ry="8" fill="#ffb3ba" opacity="0.5"/>

  <!-- Chat bubble above head -->
  <g>
    <rect x="55" y="20" width="90" height="35" rx="12" fill="white" stroke="#25d366" stroke-width="2"/>
    <!-- Triangle pointer -->
    <path d="M 65 55 L 75 35 L 55 50 Z" fill="white" stroke="#25d366" stroke-width="2"/>
    <!-- Message text representation -->
    <line x1="65" y1="30" x2="105" y2="30" stroke="#25d366" stroke-width="1.5" opacity="0.6"/>
    <line x1="65" y1="38" x2="130" y2="38" stroke="#25d366" stroke-width="1.5" opacity="0.6"/>
    <line x1="65" y1="46" x2="95" y2="46" stroke="#25d366" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Checkmarks (sent indicator) -->
  <g transform="translate(145, 145)">
    <circle r="10" fill="white" stroke="#25d366" stroke-width="1.5"/>
    <path d="M -4 -1 L -1 2 L 3 -2" stroke="#25d366" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <style>
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); transform-origin: 125px 100px; }
      25% { transform: rotate(-30deg); transform-origin: 125px 100px; }
      75% { transform: rotate(30deg); transform-origin: 125px 100px; }
    }
  </style>
</svg>