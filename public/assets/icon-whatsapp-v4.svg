<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes messageSlide {
        0% { transform: translateX(-100px); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateX(0px); opacity: 0; }
      }
      @keyframes rotate360 {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .wa-bubble { animation: messageSlide 3s ease-in-out infinite; }
      .wa-dot { animation: rotate360 4s linear infinite; }
    </style>
  </defs>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="waGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#25d366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a9e4a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="100" cy="100" r="100" fill="url(#waGradient)"/>

  <!-- Geometric character -->
  <g>
    <!-- Head (geometric circle) -->
    <circle cx="100" cy="65" r="30" fill="white" opacity="0.95"/>
    
    <!-- Eyes (modern geometric) -->
    <g>
      <!-- Left eye -->
      <rect x="82" y="56" width="12" height="12" rx="3" fill="#25d366"/>
      <circle cx="88" cy="62" r="3" fill="white"/>
      
      <!-- Right eye -->
      <rect x="106" y="56" width="12" height="12" rx="3" fill="#25d366"/>
      <circle cx="112" cy="62" r="3" fill="white"/>
    </g>

    <!-- Smile (geometric line) -->
    <path d="M 85 75 Q 100 82 115 75" stroke="#25d366" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Body (geometric shape) -->
    <path d="M 75 95 L 125 95 L 120 135 L 80 135 Z" fill="white" opacity="0.95"/>

    <!-- Chat bubbles floating around -->
    <g class="wa-bubble" style="transform-origin: 100px 100px;">
      <!-- Message bubble 1 -->
      <g transform="translate(-50, -40)">
        <rect x="70" y="110" width="50" height="30" rx="8" fill="white" stroke="#25d366" stroke-width="1.5"/>
        <line x1="75" y1="118" x2="105" y2="118" stroke="#25d366" stroke-width="1" opacity="0.5"/>
        <line x1="75" y1="125" x2="95" y2="125" stroke="#25d366" stroke-width="1" opacity="0.5"/>
      </g>
    </g>

    <!-- Accent elements (dots) -->
    <g class="wa-dot" style="transform-origin: 140px 65px;">
      <circle cx="140" cy="65" r="4" fill="white" opacity="0.7"/>
    </g>

    <!-- Hand gesture (thumbs up / wave) -->
    <g>
      <!-- Waving hand -->
      <rect x="130" y="110" width="16" height="28" rx="6" fill="white" opacity="0.9"/>
      <!-- Fingers -->
      <rect x="135" y="100" width="6" height="12" rx="3" fill="white" opacity="0.85"/>
      <circle cx="150" cy="115" r="5" fill="white" opacity="0.8"/>
    </g>
  </g>

  <!-- Bottom decorative element -->
  <g opacity="0.8">
    <!-- Checkmark circle -->
    <circle cx="100" cy="170" r="16" fill="white" opacity="0.9"/>
    <!-- Double checkmark (sent) -->
    <path d="M 88 170 L 92 174 L 96 168" stroke="#25d366" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 96 170 L 100 174 L 104 168" stroke="#25d366" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Shine effect -->
  <ellipse cx="80" cy="45" rx="20" ry="15" fill="white" opacity="0.2"/>
</svg>