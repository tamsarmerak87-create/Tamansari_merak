<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .wa-bubble { animation: wobble 2s ease-in-out infinite; }
      @keyframes wobble {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        25% { transform: translateY(-4px) rotate(-2deg); }
        75% { transform: translateY(-4px) rotate(2deg); }
      }
      .wa-shine { animation: shine 3s ease-in-out infinite; }
      @keyframes shine {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }
    </style>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="98" fill="#25d366" opacity="0.1"/>
  
  <!-- Main bubble (Chat container) -->
  <g class="wa-bubble">
    <!-- Bubble body -->
    <rect x="35" y="40" width="130" height="100" rx="20" fill="#25d366"/>
    
    <!-- Bubble tail -->
    <path d="M 155 130 L 160 155 L 140 135 Z" fill="#25d366"/>
    
    <!-- Shine effect -->
    <ellipse cx="70" cy="60" rx="25" ry="20" fill="white" opacity="0.3" class="wa-shine"/>
  </g>

  <!-- Left eye -->
  <circle cx="70" cy="85" r="8" fill="white"/>
  <circle cx="70" cy="85" r="5" fill="#333"/>
  <circle cx="72" cy="83" r="2" fill="white"/>

  <!-- Right eye with wink animation -->
  <g>
    <circle cx="110" cy="85" r="8" fill="white" opacity="0.9"/>
    <circle cx="110" cy="85" r="5" fill="#333" opacity="0.9"/>
    <circle cx="112" cy="83" r="2" fill="white" opacity="0.9"/>
    <style>
      @keyframes wink {
        0%, 20%, 100% { cy: 85; r: 8; }
        10% { cy: 87; r: 2; }
      }
    </style>
  </g>

  <!-- Smile (happy mouth) -->
  <g>
    <path d="M 70 110 Q 90 120 110 110" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Tongue -->
    <ellipse cx="90" cy="122" rx="6" ry="5" fill="#ff9999"/>
  </g>

  <!-- Blush (cheeks) -->
  <ellipse cx="55" cy="100" rx="8" ry="6" fill="#ffb3ba" opacity="0.6"/>
  <ellipse cx="125" cy="100" rx="8" ry="6" fill="#ffb3ba" opacity="0.6"/>

  <!-- Floating message bubbles around (showing activity) -->
  <g opacity="0.7">
    <!-- Small bubble 1 -->
    <circle cx="30" cy="50" r="4" fill="#25d366"/>
    <circle cx="22" cy="45" r="2" fill="#25d366"/>
    
    <!-- Small bubble 2 -->
    <circle cx="165" cy="70" r="5" fill="#25d366"/>
    <circle cx="175" cy="75" r="2" fill="#25d366"/>
    
    <!-- Small bubble 3 -->
    <circle cx="25" cy="140" r="3" fill="#25d366"/>
    <circle cx="20" cy="148" r="2" fill="#25d366"/>
  </g>

  <!-- WhatsApp checkmark (delivery indicator) -->
  <g transform="translate(145, 135)">
    <circle r="8" fill="#25d366" opacity="0.2"/>
    <path d="M -4 0 L -1 3 L 4 -2" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>